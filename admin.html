<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Bounty Journal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
    .admin-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
    .admin-bar h1 { font-size:1.5rem; display:flex; align-items:center; gap:10px; }
    .admin-bar .badge-live { font-family:var(--font-mono); font-size:.7rem; padding:4px 10px; border-radius:20px; background:var(--accent-glow); color:var(--accent); border:1px solid var(--accent); }
    /* Login */
    .login-card { max-width:400px; margin:80px auto; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px 32px; }
    .login-card h2 { font-size:1.3rem; margin-bottom:6px; }
    .login-card p { color:var(--text-secondary); font-size:.9rem; margin-bottom:24px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:.8rem; color:var(--text-secondary); margin-bottom:6px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.5px; }
    .field input, .field textarea, .field select {
      width:100%; background:var(--code-bg); border:1px solid var(--border); border-radius:var(--radius);
      color:var(--text-primary); padding:11px 13px; font-family:var(--font-sans); font-size:.92rem; transition:border .15s;
    }
    .field textarea { resize:vertical; min-height:90px; font-family:var(--font-mono); font-size:.85rem; line-height:1.5; }
    .field input:focus, .field textarea:focus, .field select:focus { outline:none; border-color:var(--accent); }
    .btn {
      background:var(--accent); color:#0a0a0f; border:none; border-radius:var(--radius); padding:11px 22px;
      font-weight:700; font-size:.9rem; cursor:pointer; font-family:var(--font-sans); transition:transform .1s, opacity .15s;
    }
    .btn:hover { opacity:.9; } .btn:active { transform:scale(.98); }
    .btn-ghost { background:transparent; border:1px solid var(--border-active); color:var(--text-primary); }
    .btn-danger { background:var(--critical); color:#fff; }
    .btn-sm { padding:6px 12px; font-size:.8rem; }
    .msg { padding:10px 14px; border-radius:var(--radius); font-size:.85rem; margin-bottom:16px; display:none; }
    .msg.err { background:rgba(255,77,106,.12); border:1px solid var(--critical); color:#ff8098; display:block; }
    .msg.ok { background:rgba(76,175,80,.12); border:1px solid var(--low); color:#7fd883; display:block; }
    /* Toolbar */
    .toolbar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
    .toolbar .spacer { flex:1; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    @media(max-width:640px){ .grid2,.grid3{grid-template-columns:1fr;} }
    /* Entry list */
    .adm-entry { background:var(--bg-card); border:1px solid var(--border); border-left:4px solid var(--sev); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; display:flex; align-items:center; gap:16px; }
    .adm-entry .info { flex:1; min-width:0; }
    .adm-entry .slug { font-family:var(--font-mono); font-size:.72rem; color:var(--text-muted); }
    .adm-entry .ttl { font-weight:600; font-size:.98rem; margin:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .adm-entry .sub { font-size:.78rem; color:var(--text-secondary); }
    .adm-entry .actions { display:flex; gap:8px; flex-shrink:0; }
    .sev-tag { font-size:.68rem; padding:2px 8px; border-radius:12px; font-family:var(--font-mono); text-transform:uppercase; }
    /* Editor overlay */
    .editor-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); z-index:1000; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px; }
    .editor-overlay.active { display:flex; }
    .editor { background:var(--bg-card); border:1px solid var(--border-active); border-radius:var(--radius-lg); max-width:720px; width:100%; padding:28px 30px; }
    .editor h3 { font-size:1.2rem; margin-bottom:20px; }
    .editor-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:8px; }
    .hidden { display:none !important; }
    .hint { font-size:.72rem; color:var(--text-muted); margin-top:4px; }
  </style>
</head>
<body>
  <div class="noise"></div>

  <!-- LOGIN VIEW -->
  <div id="loginView">
    <div class="login-card">
      <h2>🔐 Admin Access</h2>
      <p>Bounty Journal — sign in to manage entries.</p>
      <div id="loginMsg" class="msg"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" id="loginBtn" style="width:100%;">Sign In</button>
    </div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="adminView" class="admin-wrap hidden">
    <div class="admin-bar">
      <h1>🎯 Bounty Journal <span class="badge-live">ADMIN</span></h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="/" class="btn btn-ghost btn-sm" target="_blank">View Site ↗</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div id="adminMsg" class="msg"></div>

    <div class="toolbar">
      <button class="btn" id="newBtn">+ New Entry</button>
      <div class="spacer"></div>
      <span id="countLabel" style="color:var(--text-secondary); font-size:.85rem;"></span>
    </div>

    <div id="entryList"></div>
  </div>

  <!-- EDITOR -->
  <div class="editor-overlay" id="editorOverlay">
    <div class="editor">
      <h3 id="editorTitle">New Entry</h3>
      <div id="editorMsg" class="msg"></div>
      <input type="hidden" id="f_id">
      <div class="grid2">
        <div class="field">
          <label>Slug / Entry ID *</label>
          <input type="text" id="f_slug" placeholder="BOUNTY-2025-010">
          <div class="hint">Unique. E.g. BOUNTY-2025-010</div>
        </div>
        <div class="field">
          <label>Severity *</label>
          <select id="f_severity">
            <option value="critical">critical</option>
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
            <option value="info">info</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Title *</label>
        <input type="text" id="f_title" placeholder="IDOR in User Profile Export...">
      </div>
      <div class="grid3">
        <div class="field">
          <label>Target</label>
          <input type="text" id="f_target" placeholder="api.example.com">
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="f_date">
        </div>
        <div class="field">
          <label>Bounty ($)</label>
          <input type="number" id="f_bounty" placeholder="0" min="0">
        </div>
      </div>
      <div class="grid3">
        <div class="field">
          <label>CVE</label>
          <input type="text" id="f_cve" placeholder="CVE-2025-XXXX (optional)">
        </div>
        <div class="field">
          <label>CVSS</label>
          <input type="number" id="f_cvss" placeholder="9.1" step="0.1" min="0" max="10">
        </div>
        <div class="field">
          <label>Status</label>
          <input type="text" id="f_status" placeholder="Resolved">
        </div>
      </div>
      <div class="field">
        <label>Technique</label>
        <input type="text" id="f_technique" placeholder="IDOR / Broken Object Level Authorization">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f_description"></textarea>
      </div>
      <div class="field">
        <label>Steps to Reproduce</label>
        <textarea id="f_steps" style="min-height:130px;"></textarea>
      </div>
      <div class="field">
        <label>Impact</label>
        <textarea id="f_impact"></textarea>
      </div>
      <div class="field">
        <label>Remediation</label>
        <textarea id="f_remediation"></textarea>
      </div>
      <div class="field">
        <label>References (one URL per line)</label>
        <textarea id="f_refs" placeholder="https://owasp.org/..."></textarea>
      </div>
      <div class="editor-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn" id="saveBtn">Save Entry</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
